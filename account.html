<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Your library · Hexa Studio</title>
  <meta name="theme-color" content="#0a0608" />
  <meta name="robots" content="noindex, nofollow" />
  <link rel="icon" type="image/avif" href="assets/brand/hexa-logo.avif" />
  <link rel="apple-touch-icon" href="assets/brand/hexa-logo.avif" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400..800&family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css" />
  <style>
    .acct-nav {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      padding: 18px 28px;
      max-width: var(--max-w);
      margin: 0 auto;
      position: relative;
      z-index: 2;
    }
    .acct-nav .brand {
      display: inline-flex; align-items: center; gap: 10px;
      text-decoration: none; color: var(--text);
      font-family: var(--font-display); font-weight: 700; font-size: 19px; letter-spacing: -0.02em;
    }
    .acct-nav .brand img { width: 28px; height: 28px; border-radius: 7px; }
    .brand-dot { color: var(--accent); }
    .acct-nav-right { display: inline-flex; align-items: center; gap: 14px; }
    .acct-user { font-size: 13.5px; color: var(--text-mute); max-width: 200px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .acct-new {
      display: inline-flex; align-items: center; gap: 7px;
      padding: 9px 16px; border-radius: 999px;
      background: linear-gradient(92deg, var(--accent), var(--accent-deep));
      color: #fff; text-decoration: none; font-size: 14px; font-weight: 700;
      transition: transform 160ms var(--ease), box-shadow 160ms var(--ease);
    }
    .acct-new:hover { transform: translateY(-1px); box-shadow: var(--glow-accent); }
    .acct-signout { background: none; border: none; color: var(--text-faint); font-family: inherit; font-size: 13px; cursor: pointer; transition: color 160ms var(--ease); }
    .acct-signout:hover { color: var(--text); }

    .acct-main { max-width: var(--max-w); margin: 0 auto; padding: 20px 28px 80px; position: relative; z-index: 1; }
    .acct-head { margin: 18px 0 26px; }
    .acct-kicker {
      margin: 0 0 6px; font-family: var(--font-mono); font-size: 11px; font-weight: 600;
      letter-spacing: 0.18em; text-transform: uppercase; color: var(--accent-soft);
    }
    .acct-title { margin: 0; font-family: var(--font-display); font-size: clamp(28px, 4vw, 40px); font-weight: 700; letter-spacing: -0.03em; }

    .acct-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 18px; }

    .cr-card {
      display: flex; flex-direction: column;
      border-radius: var(--tile-radius); overflow: hidden;
      background: linear-gradient(180deg, rgba(255, 255, 255, 0.04), rgba(255, 255, 255, 0.012));
      border: 1px solid var(--border-strong);
      text-decoration: none; color: var(--text);
      transition: transform 180ms var(--ease), box-shadow 180ms var(--ease), border-color 180ms var(--ease);
    }
    .cr-card:hover { transform: translateY(-3px); box-shadow: var(--shadow-2); border-color: rgba(255, 255, 255, 0.22); }
    .cr-thumb { aspect-ratio: 4 / 5; background: var(--surface-media) center/cover no-repeat; position: relative; }
    .cr-thumb video, .cr-thumb img { width: 100%; height: 100%; object-fit: cover; display: block; }
    .cr-badge {
      position: absolute; top: 10px; left: 10px;
      padding: 4px 9px; border-radius: 7px; font-family: var(--font-mono);
      font-size: 10px; font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase;
      background: rgba(10, 6, 8, 0.7); color: #fff; backdrop-filter: blur(6px);
    }
    .cr-body { padding: 13px 14px 15px; }
    .cr-name { font-size: 14.5px; font-weight: 600; margin: 0 0 4px; line-height: 1.25; }
    .cr-meta { font-family: var(--font-mono); font-size: 11px; color: var(--text-faint); letter-spacing: 0.04em; }
    .cr-card.pending .cr-thumb { display: grid; place-items: center; }
    .cr-pending-dot { font-family: var(--font-mono); font-size: 11px; color: var(--accent-soft); letter-spacing: 0.1em; text-transform: uppercase; }

    .acct-empty {
      max-width: 520px; margin: 40px auto; text-align: center;
      padding: 48px 32px; border-radius: 24px;
      background: radial-gradient(120% 90% at 50% 0%, rgba(255, 77, 109, 0.12), transparent 62%),
        linear-gradient(180deg, rgba(255, 255, 255, 0.035), rgba(255, 255, 255, 0.01));
      border: 1px solid var(--border-strong);
    }
    .acct-empty-badge {
      display: inline-grid; place-items: center; width: 56px; height: 56px; margin-bottom: 18px;
      border-radius: 16px; background: linear-gradient(160deg, var(--accent), var(--accent-deep));
      box-shadow: var(--glow-accent);
    }
    .acct-empty-badge svg { width: 26px; height: 26px; }
    .acct-empty h2 { margin: 0 0 10px; font-family: var(--font-display); font-size: 26px; font-weight: 700; letter-spacing: -0.02em; }
    .acct-empty p { margin: 0 auto 24px; color: var(--text-mute); font-size: 15px; max-width: 380px; }
    .acct-empty .acct-new { padding: 12px 22px; font-size: 15px; }

    .acct-state { text-align: center; padding: 60px 20px; color: var(--text-faint); font-family: var(--font-mono); font-size: 13px; letter-spacing: 0.06em; }

    @media (max-width: 560px) {
      .acct-user { display: none; }
      .acct-grid { grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 12px; }
    }
  </style>
</head>
<body class="acct-body">
  <div class="bg-grid" aria-hidden="true"></div>
  <div class="bg-glow" aria-hidden="true"></div>

  <header class="acct-nav">
    <a class="brand" href="/" aria-label="Hexa AI home">
      <img src="assets/brand/hexa-logo.avif" alt="" width="28" height="28" />
      <span>Hexa<span class="brand-dot">·</span>AI</span>
    </a>
    <div class="acct-nav-right">
      <span class="acct-user" id="acct-user"></span>
      <a class="acct-new" href="/">
        <svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>
        New creation
      </a>
      <button class="acct-signout" id="acct-signout" type="button">Sign out</button>
    </div>
  </header>

  <main class="acct-main">
    <div class="acct-head">
      <p class="acct-kicker">Your library</p>
      <h1 class="acct-title" id="acct-greeting">Everything you have made</h1>
    </div>

    <div class="acct-state" id="acct-loading">Loading your creations…</div>
    <div class="acct-grid" id="acct-grid" hidden></div>

    <div class="acct-empty" id="acct-empty" hidden>
      <span class="acct-empty-badge" aria-hidden="true">
        <svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 8h.01M12.5 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2v7.5"/><path d="m3 16 5-5c.9-.9 2.1-.9 3 0l4 4"/><path d="M14 14l1-1c.9-.9 2.1-.9 3 0l3 3"/><path d="M19 16v6M22 19h-6"/></svg>
      </span>
      <h2>Your first creation is one link away</h2>
      <p>Paste a product link in the studio and watch it become a film so real no one can tell. Everything you make lands here.</p>
      <a class="acct-new" href="/">Start creating</a>
    </div>
  </main>

  <script src="/vendor/supabase.js"></script>
  <script src="auth.js"></script>
  <script src="account.js"></script>
</body>
</html>
