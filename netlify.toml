[build]
  publish = "."
  functions = "netlify/functions"

  [build.environment]
    # Pinned, not left to Netlify's rolling default.
    #
    # The research CLI stores its corpus in node:sqlite, which only exists from
    # Node 22, and the functions use fetch, structuredClone and top-level await
    # throughout. An unpinned runtime means Netlify can move us onto a version
    # where a cold start fails on a builtin that is simply not there, and the
    # first sign of it would be a background worker that never reports.
    NODE_VERSION = "22"

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

# The stitcher shells out to a real ffmpeg. The binary is NOT bundled: CLI
# deploys would ship this Mac's build, useless on Netlify's Linux. The
# function verifies whatever it finds with -version and self-installs the
# pinned Linux build to /tmp when needed (see ffmpegBin in the function).

# Onboarding drip: one pass an hour, so the day-0 welcome lands within the
# hour of signup instead of up to a day later. Sent-state in Blobs makes
# extra runs free; the function itself decides who is due for which email.
# DRIP_DRY_RUN=1 makes it log instead of send.
[functions."drip"]
  schedule = "0 * * * *"

# Netlify Image CDN: scraped product images live on Higgsfield's CloudFront
# as multi-hundred-KB PNGs that take 10s+ to load cold. product-peek rewrites
# them to /.netlify/images?... so the browser gets a small cached webp.
[images]
  remote_images = [
    "https://d2ol7oe51mr4n9.cloudfront.net/.*",
    "https://d8j0ntlcm91z4.cloudfront.net/.*",
  ]
